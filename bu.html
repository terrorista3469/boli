<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Corazón de Palabras</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        #ui {
            position: absolute;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #ff4d4d;
        }

        input {
            padding: 10px;
            border-radius: 5px;
            border: none;
            outline: none;
            width: 200px;
        }

        button {
            padding: 10px 20px;
            background-color: #ff4d4d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2 style="color: white;">Escribe tu nombre</h2>
        <input type="text" id="nombre" placeholder="Nombre de mi futura novia...">
        <br>
        <button onclick="dibujar()">Crear Magia</button>
    </div>

    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let animationId;

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function dibujar() {
            const nombre = document.getElementById('nombre').value || "Te amo";
            document.getElementById('ui').style.display = 'none';
            
            cancelAnimationFrame(animationId);
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let particles = [];
            const totalParticles = 1500; // Cantidad de veces que aparecerá el nombre

            // Función matemática para la forma del corazón
            for (let i = 0; i < totalParticles; i++) {
                // Ángulo aleatorio
                let t = Math.random() * 2 * Math.PI;
                
                // Ecuación del corazón
                // x = 16 * sin^3(t)
                // y = 13 * cos(t) - 5 * cos(2t) - 2 * cos(3t) - cos(4t)
                let x = 16 * Math.pow(Math.sin(t), 3);
                let y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                // Escalar y posicionar en el centro
                const scale = 15 + Math.random() * 5; 
                particles.push({
                    x: canvas.width / 2 + x * scale,
                    y: canvas.height / 2 + y * scale,
                    size: Math.random() * 12 + 8,
                    opacity: Math.random(),
                    speed: 0.01 + Math.random() * 0.02
                });
            }

            function animate() {
                ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                particles.forEach(p => {
                    ctx.fillStyle = `rgba(255, 77, 77, ${Math.abs(Math.sin(Date.now() * p.speed))})`;
                    ctx.font = `${p.size}px Arial`;
                    ctx.fillText(nombre, p.x, p.y);
                });

                animationId = requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
</body>
</html>
