<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Torneo Deportivo Pro (React)</title>

  <!-- React CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root{--bg:#f1f5f9;--card:#fff;--text:#020617;--accent:#22c55e}
    [data-theme='dark']{--bg:#020617;--card:#0f172a;--text:#e5e7eb;--accent:#38bdf8}
    body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
    header{padding:15px;text-align:center;font-size:22px;font-weight:bold}
    button{padding:10px 14px;border:none;border-radius:12px;background:var(--accent);color:white;font-weight:bold;cursor:pointer}
    input{padding:10px;border-radius:10px;border:1px solid #ccc;width:100%;margin:5px 0}
    .container{padding:15px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:15px}
    .card{background:var(--card);padding:20px;border-radius:18px;text-align:center;cursor:pointer;transition:.3s}
    .card:hover{transform:scale(1.05)}
    .match{background:var(--card);padding:15px;border-radius:15px;margin-bottom:10px}
    .score{display:flex;justify-content:space-between;align-items:center;font-size:18px}
    canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none}
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const sports=[
  {id:'futbol',name:'Fútbol',icon:'⚽'},
  {id:'ping',name:'Ping Pong',icon:'🏓'},
  {id:'bolirana',name:'Bolirana',icon:'🎳'},
  {id:'tejo',name:'Tejo',icon:'💣'}
];

function App(){
  const [theme,setTheme]=React.useState('light');
  const [step,setStep]=React.useState('sports');
  const [sport,setSport]=React.useState(null);
  const [count,setCount]=React.useState(0);
  const [players,setPlayers]=React.useState([]);
  const [matches,setMatches]=React.useState([]);
  const [champion,setChampion]=React.useState(null);

  React.useEffect(()=>{document.body.setAttribute('data-theme',theme)},[theme]);

  function startTournament(){
    const shuffled=[...players].sort(()=>Math.random()-0.5);
    const m=[];
    for(let i=0;i<shuffled.length;i+=2){
      m.push({a:shuffled[i],b:shuffled[i+1],sa:0,sb:0});
    }
    setMatches(m);
    setStep('bracket');
  }

  function finishMatch(i){
    const m=[...matches];
    const win=m[i].sa>m[i].sb?m[i].a:m[i].b;
    setChampion(win);
    setStep('champion');
  }

  return(
    <>
      <header>
        🏆 Torneo Deportivo Pro
        <button onClick={()=>setTheme(theme==='light'?'dark':'light')} style={{marginLeft:10}}>🌙</button>
      </header>
      <div className="container">

      {step==='sports' && (
        <div className="grid">
          {sports.map(s=>(
            <div key={s.id} className="card" onClick={()=>{setSport(s);setStep('config')}}>
              <div style={{fontSize:40}}>{s.icon}</div>{s.name}
            </div>
          ))}
        </div>
      )}

      {step==='config' && (
        <div>
          <h2>{sport.name}</h2>
          <input type="number" placeholder="Cantidad (2,4,8)" onChange={e=>setCount(+e.target.value)} />
          {[...Array(count)].map((_,i)=>(
            <input key={i} placeholder={`Jugador ${i+1}`} onChange={e=>{
              const p=[...players];p[i]=e.target.value;setPlayers(p)
            }} />
          ))}
          <button onClick={startTournament}>🎲 Sortear</button>
        </div>
      )}

      {step==='bracket' && (
        <div>
          <h2>Llaves</h2>
          {matches.map((m,i)=>(
            <div key={i} className="match">
              <div className="score">{m.a} <button onClick={()=>{const x=[...matches];x[i].sa++;setMatches(x)}}>+</button> {m.sa}</div>
              <div className="score">{m.b} <button onClick={()=>{const x=[...matches];x[i].sb++;setMatches(x)}}>+</button> {m.sb}</div>
              <button onClick={()=>finishMatch(i)}>Finalizar</button>
            </div>
          ))}
        </div>
      )}

      {step==='champion' && (
        <div style={{textAlign:'center'}}>
          <h1>🏆 Campeón</h1>
          <h2>{champion}</h2>
          <button onClick={()=>location.reload()}>Reiniciar</button>
        </div>
      )}

      </div>
    </>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
