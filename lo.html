<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTEREXPO | Tournament Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #e60000;
            --dark-red: #8b0000;
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.05);
            --border-glass: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at center, #1a0000 0%, #050505 100%);
            color: white;
            font-family: 'Oswald', sans-serif;
            margin: 0;
            overflow-x: hidden;
            height: 100vh;
        }

        /* Efecto de Luces de Fondo */
        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
            pointer-events: none;
            z-index: 10;
        }

        .overlay {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(5px);
        }

        .screen {
            display: none;
            width: 100%;
            max-width: 900px;
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        .active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Branding INTEREXPO */
        .brand-title {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin: 0;
            text-transform: uppercase;
            color: white;
            text-shadow: 0 0 30px rgba(230, 0, 0, 0.6);
        }
        .brand-sub {
            color: var(--primary-red);
            font-size: 1.5rem;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Botones Pro */
        .btn {
            background: linear-gradient(135deg, var(--primary-red), var(--dark-red));
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 15px 40px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            font-size: 1.2rem;
            text-transform: uppercase;
            transition: 0.4s;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%); /* Estilo inclinado pro */
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.05) skewX(-2deg);
            box-shadow: 0 0 40px var(--primary-red);
            filter: brightness(1.2);
        }

        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Marcador de Tiempo y Score */
        .timer-box {
            font-size: 6rem;
            color: white;
            background: rgba(0,0,0,0.8);
            border-left: 5px solid var(--primary-red);
            border-right: 5px solid var(--primary-red);
            padding: 0 40px;
            margin-bottom: 20px;
            display: inline-block;
        }

        .score-num {
            font-size: 12rem;
            font-weight: 700;
            line-height: 1;
            margin: 0;
            color: white;
            text-shadow: 0 0 50px rgba(255,255,255,0.2);
        }

        /* Contenedores de Cristal */
        .glass-panel {
            background: var(--glass);
            border: 1px solid var(--border-glass);
            padding: 30px;
            border-radius: 15px;
            margin: 20px 0;
        }

        /* Input Estilizado */
        input[type="text"] {
            background: rgba(0,0,0,0.5);
            border: none;
            border-bottom: 2px solid var(--primary-red);
            padding: 15px;
            color: white;
            font-family: 'Oswald';
            font-size: 1.5rem;
            width: 70%;
            outline: none;
            margin-bottom: 20px;
        }

        .player-item {
            background: rgba(230, 0, 0, 0.1);
            border-left: 4px solid var(--primary-red);
            margin: 5px;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
        }

        /* Selector de Tiempo */
        .time-selector { display: flex; justify-content: center; gap: 10px; margin-top: 15px; }
        .t-btn {
            background: transparent; border: 1px solid var(--border-glass);
            color: white; padding: 10px 20px; cursor: pointer; transition: 0.3s;
        }
        .t-btn.selected { background: var(--primary-red); border-color: var(--primary-red); }

        .vs-text { font-size: 4rem; color: var(--primary-red); opacity: 0.5; font-style: italic; }
    </style>
</head>
<body>

<div class="overlay">
    
    <section id="screen-welcome" class="screen active">
        <h1 class="brand-title">INTEREXPO</h1>
        <div class="brand-sub">Tournament System</div>
        <div class="glass-panel">
            <p style="font-size: 1.2rem; opacity: 0.8;">BIENVENIDOS AL MARCADOR OFICIAL<br>Desarollado por Daniel Sarmiento Aprendiz Sena - 2025 </p>
            <button class="btn" onclick="showScreen('screen-setup')">CONFIGURAR TORNEO</button>
        </div>
    </section>

    <section id="screen-setup" class="screen">
        <h2 class="brand-sub">Registro de Jugadores</h2>
        <input type="text" id="player-input" placeholder="ESCRIBA NOMBRE..." onkeypress="if(event.key==='Enter') addPlayer()">
        <br>
        <button class="btn" onclick="addPlayer()">AÑADIR</button>
        <div id="list-container" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px;"></div>
        <br>
        <button class="btn" id="start-btn" onclick="triggerShuffle()" disabled>GENERAR ENCUENTROS</button>
    </section>

    <section id="screen-shuffling" class="screen">
        <h1 class="brand-sub">Sorteando...</h1>
        <div id="shuffle-name" style="font-size: 5rem; color: white;">---</div>
    </section>

    <section id="screen-draw" class="screen">
        <h2 class="brand-sub">Llave Actual</h2>
        <div id="bracket-container" style="margin-bottom: 30px;"></div>
        
        <div class="glass-panel">
            <h3>TIEMPO DE PARTIDA</h3>
            <div class="time-selector">
                <button class="t-btn selected" onclick="setTime(1, this)">1:00</button>
                <button class="t-btn" onclick="setTime(3, this)">3:00</button>
                <button class="t-btn" onclick="setTime(5, this)">5:00</button>
            </div>
        </div>
        <button class="btn" onclick="startArena()">ENTRAR A LA ARENA</button>
    </section>

    <section id="screen-arena" class="screen">
        <div class="brand-sub" style="margin: 0;">Marcador Oficial</div>
        <div class="timer-box" id="clock">00:00</div>
        
        <div style="display: flex; align-items: center; justify-content: space-between;">
            <div style="flex: 1;">
                <h2 id="p1-name" style="font-size: 3rem; margin:0; text-transform: uppercase;">---</h2>
                <div class="score-num" id="p1-score">0</div>
                <button class="btn btn-score" style="width:150px; clip-path:none;" onclick="score(1)">+ PUNTOS</button>
            </div>
            
            <div class="vs-text">VS</div>

            <div style="flex: 1;">
                <h2 id="p2-name" style="font-size: 3rem; margin:0; text-transform: uppercase;">---</h2>
                <div class="score-num" id="p2-score">0</div>
                <button class="btn btn-score" style="width:150px; clip-path:none;" onclick="score(2)">+ PUNTOS</button>
            </div>
        </div>

        <button class="btn btn-finish" id="finish-btn" onclick="confirmWinner()" style="margin-top: 50px; width: 80%;">FINALIZAR ENCUENTRO</button>
    </section>

    <section id="screen-winner" class="screen">
        <h1 class="brand-title">CAMPEÓN</h1>
        <h1 id="final-champ" style="font-size: 6rem; color: var(--primary-red); text-shadow: 0 0 30px red;">---</h1>
        <button class="btn" onclick="location.reload()">NUEVO TORNEO</button>
    </section>

</div>

<script>
    let players = [];
    let winners = [];
    let matchIndex = 0;
    let selectedMinutes = 1;
    let timerInterval;

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function setTime(m, el) {
        selectedMinutes = m;
        document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
    }

    function addPlayer() {
        const input = document.getElementById('player-input');
        if(!input.value.trim()) return;
        players.push(input.value.trim());
        input.value = "";
        updateUI();
    }

    function updateUI() {
        const container = document.getElementById('list-container');
        container.innerHTML = players.map((p, i) => `
            <div class="player-item">
                <span>${p}</span>
                <span style="cursor:pointer; color:white;" onclick="players.splice(${i},1);updateUI()">×</span>
            </div>
        `).join('');
        const n = players.length;
        document.getElementById('start-btn').disabled = !(n >= 2 && (n & (n - 1)) === 0);
    }

    function triggerShuffle() {
        showScreen('screen-shuffling');
        let count = 0;
        const interval = setInterval(() => {
            document.getElementById('shuffle-name').innerText = players[Math.floor(Math.random() * players.length)];
            if(count++ > 20) {
                clearInterval(interval);
                players.sort(() => Math.random() - 0.5);
                renderBracket();
                showScreen('screen-draw');
            }
        }, 100);
    }

    function renderBracket() {
        const container = document.getElementById('bracket-container');
        let html = '<div class="glass-panel" style="display:inline-block; min-width:300px;">';
        for (let i = 0; i < players.length; i += 2) {
            html += `<div style="padding:10px; border-bottom:1px solid var(--border-glass); ${i === matchIndex ? 'color:var(--primary-red); font-weight:bold;' : ''}">
                ${players[i]} vs ${players[i+1]}
            </div>`;
        }
        html += '</div>';
        container.innerHTML = html;
    }

    function startArena() {
        loadMatch();
        showScreen('screen-arena');
        startTimer(selectedMinutes * 60);
    }

    function startTimer(seconds) {
        clearInterval(timerInterval);
        let timeRemaining = seconds;
        const clock = document.getElementById('clock');
        
        const updateClock = () => {
            let mins = Math.floor(timeRemaining / 60);
            let secs = timeRemaining % 60;
            clock.innerText = `${mins}:${secs.toString().padStart(2,'0')}`;
            if (timeRemaining <= 0) {
                clearInterval(timerInterval);
                clock.style.color = "red";
                alert("¡FIN DEL TIEMPO!");
            }
            timeRemaining--;
        };
        updateClock();
        timerInterval = setInterval(updateClock, 1000);
    }

    function loadMatch() {
        document.getElementById('p1-name').innerText = players[matchIndex];
        document.getElementById('p2-name').innerText = players[matchIndex+1];
        document.getElementById('p1-score').innerText = "0";
        document.getElementById('p2-score').innerText = "0";
    }

    function score(p) {
        const el = document.getElementById(`p${p}-score`);
        el.innerText = parseInt(el.innerText) + 1;
    }

    function confirmWinner() {
        clearInterval(timerInterval);
        const s1 = parseInt(document.getElementById('p1-score').innerText);
        const s2 = parseInt(document.getElementById('p2-score').innerText);
        if(s1 === s2) return alert("DESEMPATE REQUERIDO");

        winners.push(s1 > s2 ? players[matchIndex] : players[matchIndex + 1]);
        matchIndex += 2;

        if(matchIndex >= players.length) {
            if(winners.length === 1) {
                showScreen('screen-winner');
                document.getElementById('final-champ').innerText = winners[0];
            } else {
                players = [...winners]; winners = []; matchIndex = 0;
                renderBracket(); showScreen('screen-draw');
            }
        } else {
            renderBracket(); showScreen('screen-draw');
        }
    }
</script>
</body>
</html>
